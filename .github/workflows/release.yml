name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.15,<7" pyinstaller-hooks-contrib

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Build Windows application
        run: pyinstaller --noconfirm --clean packaging/AssistantTool.spec

      - name: Package release
        shell: pwsh
        run: |
          Copy-Item README.md dist\AssistantTool\README.md
          Copy-Item config.example.json dist\AssistantTool\config.example.json
          New-Item -ItemType Directory -Force dist_final | Out-Null
          Compress-Archive -Path dist\AssistantTool\* -DestinationPath dist_final\AssistantTool-Windows.zip

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist_final/AssistantTool-Windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist_final/AssistantTool-Windows.zip
          generate_release_notes: true
